services:
  postgres:
    image: postgres:16-alpine
    container_name: kartmitra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kartmitra_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kartmitra_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
